<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>🩺 Diabetes Risk Prediction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4 text-center">🩺 Diabetes Risk Predictor</h2>
    <form action="/predict" method="POST" class="p-4 bg-white rounded shadow">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="pregnancies" class="form-label">Pregnancies</label>
          <input type="number" name="pregnancies" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="glucose" class="form-label">Glucose Level</label>
          <input type="number" name="glucose" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="blood_pressure" class="form-label">Blood Pressure</label>
          <input type="number" name="blood_pressure" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="bmi" class="form-label">BMI (Body Mass Index)</label>
          <input type="number" step="0.1" name="bmi" class="form-control" required
            placeholder="Weight In KG/(Height In M)^2">
        </div>
        <div class="col-md-6">
          <label for="age" class="form-label">Age</label>
          <input type="number" name="age" class="form-control" required>
        </div>
      </div>
      <div class="mt-4 text-center">
        <button type="submit" class="btn btn-primary px-4">Predict Risk</button>
      </div>
    </form>
  </div>
</body>

</html>
